# Only needed without workload identity. Copy, fill in, apply; never commit real values.
# Keep the keys for your provider only (Azure needs exactly one auth mode).
apiVersion: v1
kind: Secret
metadata:
  name: h2-migration-storage
  labels:
    app.kubernetes.io/name: h2-update-utility
type: Opaque
stringData:
  # S3
  S3_ACCESS_KEY: "<access-key>"
  S3_SECRET_KEY: "<secret-key>"
  # Azure
  # AZ_CONN_STRING: "<azure-storage-connection-string>"
  # MinIO
  # MINIO_ACCESS_KEY: "<access-key>"
  # MINIO_SECRET_KEY: "<secret-key>"
  # GCS (rclone backend only; prefer a mounted file, see README)
  # GCS_SERVICE_ACCOUNT_JSON: "<service-account-json>"
